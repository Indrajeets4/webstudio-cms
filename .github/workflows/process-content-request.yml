
name: Process Blog Content Request

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-blog:
    if: startsWith(github.event.issue.title, '[Content CMS] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Process content request and create pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            function getField(label) {
              const lines = (issue.body || '').split(/\r?\n/);
              const heading = `### ${label}`;
              const start = lines.findIndex(
                line => line.trim() === heading
              );

              if (start === -1) return '';

              const value = [];

              for (let i = start + 1; i < lines.length; i++) {
                if (/^###\s/.test(lines[i])) break;
                value.push(lines[i]);
              }

              const result = value.join('\n').trim();

              if (!result || result === '_No response_') {
                return '';
              }

              return result;
            }

            async function fail(message) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `⚠️ **Content request not processed**\n\n${message}`
              });

              throw new Error(message);
            }

            try {
              // Only the repository owner can request automatic changes.
              if (
                issue.user.login.toLowerCase() !== owner.toLowerCase()
              ) {
                await fail(
                  'Only the repository owner can submit automated content requests.'
                );
              }

              // Read the submitted form.
              const action = getField('Action');
              const articleId = getField('Article ID');
              const published = getField('Publication status');

              if (!articleId) {
                await fail('Article ID is required.');
              }

              const fields = {
                title: getField('Article title'),
                slug: getField('Article slug'),
                category: getField('Category'),
                author: getField('Author'),
                date: getField('Publication date'),
                thumbnail: getField('Thumbnail image URL'),
                excerpt: getField('Short description'),
                content: getField('Full article content')
              };

              // Validate publication date.
              if (fields.date) {
                const match = fields.date.match(
                  /^(\d{4})-(\d{2})-(\d{2})$/
                );

                if (!match) {
                  await fail('Date must use YYYY-MM-DD format.');
                }

                const date = new Date(
                  Date.UTC(
                    Number(match[1]),
                    Number(match[2]) - 1,
                    Number(match[3])
                  )
                );

                if (
                  date.getUTCFullYear() !== Number(match[1]) ||
                  date.getUTCMonth() !== Number(match[2]) - 1 ||
                  date.getUTCDate() !== Number(match[3])
                ) {
                  await fail('Please enter a valid calendar date.');
                }
              }

              // Validate slug.
              if (
                fields.slug &&
                !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(fields.slug)
              ) {
                await fail(
                  'Slug must contain lowercase letters, numbers and single hyphens.'
                );
              }

              // Validate thumbnail URL.
              if (fields.thumbnail) {
                try {
                  const imageUrl = new URL(fields.thumbnail);

                  if (imageUrl.protocol !== 'https:') {
                    throw new Error('HTTPS required');
                  }
                } catch {
                  await fail(
                    'Thumbnail must be a valid HTTPS image URL.'
                  );
                }
              }

              // Read the latest JSON file from main.
              const base = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'main'
              });

              const file = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'posts/index.json',
                ref: base.data.commit.sha
              });

              if (Array.isArray(file.data)) {
                await fail('The posts/index.json file was not found.');
              }

              const posts = JSON.parse(
                Buffer.from(
                  file.data.content,
                  'base64'
                ).toString('utf8')
              );

              if (!Array.isArray(posts)) {
                await fail(
                  'posts/index.json must contain a JSON array.'
                );
              }

              // Find the article by ID.
              let article = posts.find(
                post => String(post.id) === articleId
              );

              // Update an existing article.
              if (action === 'Update existing article') {
                if (!article) {
                  await fail(`Article ID ${articleId} was not found.`);
                }

                let changed = false;

                for (const [key, value] of Object.entries(fields)) {
                  if (value !== '') {
                    article[key] = value;
                    changed = true;
                  }
                }

                if (published === 'true' || published === 'false') {
                  article.published = published === 'true';
                  changed = true;
                }

                if (!changed) {
                  await fail('No changes were provided.');
                }

              // Add a new article.
              } else if (action === 'Add new article') {
                if (article) {
                  await fail(
                    `Article ID ${articleId} already exists.`
                  );
                }

                const requiredFields = [
                  'title',
                  'slug',
                  'category',
                  'author',
                  'date',
                  'thumbnail',
                  'excerpt',
                  'content'
                ];

                const missing = requiredFields.filter(
                  key => !fields[key]
                );

                if (missing.length) {
                  await fail(
                    `Please complete these fields: ${missing.join(', ')}`
                  );
                }

                article = {
                  id: articleId,
                  ...fields,
                  published: published === 'false' ? false : true
                };

                posts.push(article);

              // Change publication status only.
              } else if (action === 'Change publication status') {
                if (!article) {
                  await fail(`Article ID ${articleId} was not found.`);
                }

                if (
                  published !== 'true' &&
                  published !== 'false'
                ) {
                  await fail(
                    'Choose true or false for publication status.'
                  );
                }

                article.published = published === 'true';

              } else {
                await fail('Please select a valid action.');
              }

              // Prevent duplicate IDs.
              const ids = posts.map(
                post => String(post.id)
              );

              if (new Set(ids).size !== ids.length) {
                await fail('Duplicate article IDs detected.');
              }

              // Prevent duplicate slugs.
              const slugs = posts.map(
                post => post.slug
              );

              if (new Set(slugs).size !== slugs.length) {
                await fail('Duplicate article slugs detected.');
              }

              // Create a separate branch.
              const branchName =
                `content-request-${issue.number}-${context.runId}`;

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: base.data.commit.sha
              });

              // Update JSON on the new branch.
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: 'posts/index.json',
                message: `Apply blog content request #${issue.number}`,
                content: Buffer.from(
                  JSON.stringify(posts, null, 2) + '\n'
                ).toString('base64'),
                sha: file.data.sha,
                branch: branchName
              });

              // Create a Pull Request for review.
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: `[CMS] ${issue.title}`,
                head: branchName,
                base: 'main',
                body: [
                  '## Blog content update',
                  '',
                  `Requested in issue #${issue.number}.`,
                  '',
                  `Action: **${action}**`,
                  `Article ID: **${articleId}**`,
                  '',
                  'Please review the JSON changes before merging.',
                  '',
                  'Merging this PR updates the live GitHub Raw JSON source.'
                ].join('\n')
              });

              // Notify the original issue.
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  '✅ Your content request has been processed.',
                  '',
                  `Review the proposed changes: ${pr.data.html_url}`,
                  '',
                  'The website content will update after the Pull Request is merged.'
                ].join('\n')
              });

            } catch (error) {
              core.setFailed(error.message);
              throw error;
            }
