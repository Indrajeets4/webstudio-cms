
name: Blog Content Request
description: Add or update articles in the Webstudio blog CMS.
title: "[Content CMS] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to add or update blog articles.
        Leave fields blank if you do not want to change them.
        Every request will create a Pull Request for review.
        Changes will not be published directly to the live website.

  - type: dropdown
    id: action
    attributes:
      label: Action
      description: What do you want to do?
      options:
        - Update existing article
        - Add new article
        - Change publication status
    validations:
      required: true

  - type: input
    id: article_id
    attributes:
      label: Article ID
      description: Existing ID for updates, or a unique ID for a new article.
      placeholder: "2"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Article title
      description: Enter a new title, or leave blank to keep the existing title.
    validations:
      required: false

  - type: input
    id: slug
    attributes:
      label: Article slug
      description: Changing this will change the article URL.
    validations:
      required: false

  - type: input
    id: category
    attributes:
      label: Category
    validations:
      required: false

  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: false

  - type: input
    id: date
    attributes:
      label: Publication date
      description: Use YYYY-MM-DD.
      placeholder: "2026-11-03"
    validations:
      required: false

  - type: input
    id: thumbnail
    attributes:
      label: Thumbnail image URL
      description: Enter a direct image URL that opens in a browser.
    validations:
      required: false

  - type: textarea
    id: excerpt
    attributes:
      label: Short description
      description: This appears on the blog listing card.
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Full article content
      description: Use HTML headings and paragraphs, for example <h2>Introduction</h2><p>Article text...</p>.
    validations:
      required: false

  - type: dropdown
    id: published
    attributes:
      label: Publication status
      options:
        - Keep current
        - "true"
        - "false"
    validations:
      required: true
